name: Sync fork with upstream

on:
  schedule:
    # Everyday at 23:30 UTC
    - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  sync-main:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: "5rahim/seanime"
      UPSTREAM_BRANCH: "main"
      MAIN_BRANCH: "main"

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git || true
          git fetch upstream
          git fetch origin

      - name: Merge upstream into main
        run: |
          git checkout ${MAIN_BRANCH}
          git merge --no-edit upstream/${UPSTREAM_BRANCH} || {
            echo "Merge conflict detected. Please resolve conflicts manually.";
            exit 1;
          }

      - name: Push updated main to origin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" ${MAIN_BRANCH}
